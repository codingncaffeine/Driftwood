# The Windows release gate. The Windows zip is built on Linux (packaging/windows/build-zip.sh, the last
# step of publish-release.sh) and attached to a DRAFT release; this job downloads exactly that zip,
# checks its sha256, and runs the game's own instruments on a real Windows machine. The release is
# published only when every shard passes, so the bytes that were checked are the bytes that ship.
#
# Run: gh workflow run windows-gate.yml -f release=vX.Y.Z   (the draft's tag name)
# Shards run side by side so no single job goes past a few minutes.
name: Windows gate

on:
  workflow_dispatch:
    inputs:
      release:
        description: Tag name of the (draft) release that holds the Windows zip
        required: true

# Drafts are visible only to a token that can write the repository's contents.
permissions:
  contents: write

concurrency:
  group: windows-gate-${{ inputs.release }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.shard }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [basics, audit, ui-400x480, ui-1028x749, ui-1600x900, coop, installer]
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ inputs.release }}
      # The null device: OpenAL starts, nothing plays (the runner has no sound card anyway).
      ALSOFT_DRIVERS: null
      DRIFTWOOD_TRACE: "1"
      # Git Bash would turn /S, /v and friends into paths; Windows programs here take them literally.
      MSYS_NO_PATHCONV: "1"
      # Mesa's software rasteriser for the interface check: the runner has no OpenGL 3.3 driver.
      MESA_VERSION: 26.2.4
      MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
    steps:
      - name: Fetch the release's Windows zip
        run: |
          set -euo pipefail
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30")
          asset() { jq -r --arg tag "$RELEASE" --arg end "$1" \
            '.[] | select(.tag_name == $tag) | .assets[] | select(.name | endswith($end)) | .url' <<<"$releases" | head -1; }
          zip_url=$(asset "-win-x64.zip"); sum_url=$(asset "-win-x64.zip.sha256")
          [ -n "$zip_url" ] && [ -n "$sum_url" ] || { echo "no Windows zip + .sha256 on release $RELEASE"; exit 1; }
          mkdir -p dl && cd dl
          gh api -H "Accept: application/octet-stream" "$zip_url" > release.zip
          gh api -H "Accept: application/octet-stream" "$sum_url" > release.zip.sha256
          want=$(cut -d' ' -f1 release.zip.sha256); got=$(sha256sum release.zip | cut -d' ' -f1)
          echo "zip $(awk '{print $2}' release.zip.sha256)  sha256 $got"
          [ "$want" = "$got" ] || { echo "sha256 mismatch: want $want"; exit 1; }
          unzip -q release.zip
          dir=$(ls -d Driftwood-v*-win-x64)
          echo "GAME=$PWD/$dir" >> "$GITHUB_ENV"
          setup_url=$(asset "-win-x64-setup.exe"); setup_sum=$(asset "-win-x64-setup.exe.sha256")
          if [ -n "$setup_url" ] && [ -n "$setup_sum" ]; then
            gh api -H "Accept: application/octet-stream" "$setup_url" > setup.exe
            gh api -H "Accept: application/octet-stream" "$setup_sum" > setup.exe.sha256
            [ "$(cut -d' ' -f1 setup.exe.sha256)" = "$(sha256sum setup.exe | cut -d' ' -f1)" ] || { echo "installer sha256 mismatch"; exit 1; }
            # The installer must carry the zip's exe, byte for byte (checked after installing).
            echo "SETUP=$PWD/setup.exe" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$(sed -E 's/^Driftwood-v(.*)-win-x64$/\1/' <<<"$dir")" >> "$GITHUB_ENV"

      - name: Software OpenGL beside the exe (gate copy only, never shipped)
        if: startsWith(matrix.shard, 'ui-')
        run: |
          set -euo pipefail
          curl -fsSL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_VERSION/mesa3d-$MESA_VERSION-release-msvc.7z"
          echo "$MESA_SHA256  mesa.7z" | sha256sum -c -
          7z x -y -omesa mesa.7z x64/opengl32.dll x64/libgallium_wgl.dll > /dev/null
          cp mesa/x64/opengl32.dll mesa/x64/libgallium_wgl.dll "$GAME/"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"

      - name: Identity, audio, magic, controller
        if: matrix.shard == 'basics'
        run: |
          set -euo pipefail
          cd "$GAME"
          said=$(./Driftwood.exe --version)
          echo "$said"
          [ "$said" = "Driftwood v$VERSION" ] || { echo "the exe does not report Driftwood v$VERSION"; exit 1; }
          ./Driftwood.exe --audio-check
          ./Driftwood.exe --magic-check
          ./Driftwood.exe --controller-check

      - name: World audit
        if: matrix.shard == 'audit'
        run: cd "$GAME" && ./Driftwood.exe --audit --seed driftwood --chunks 12

      # The runner's desktop is 1024x768, which clamps a bigger window. Ask for more; the check below
      # fails if the window still did not get the size it asked for.
      - name: Desktop large enough for the window
        if: matrix.shard == 'ui-1600x900'
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "Set-DisplayResolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "desktop now $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      - name: Every interface reaches the screen
        if: startsWith(matrix.shard, 'ui-')
        run: |
          set -euo pipefail
          size=${{ matrix.shard }}; size=${size#ui-}
          cd "$GAME"
          ./Driftwood.exe --ui-check --chunks 6 --seed driftwood --width "${size%x*}" --height "${size#*x}" 2>&1 | tee ui.log
          # A window the desktop clamped is a different check that passed under this one's name.
          grep -q "^overlay     ${size} at" ui.log || { echo "the window was not ${size}: $(grep -m1 '^overlay ' ui.log)"; exit 1; }

      - name: Co-op over the network and through Epic
        if: matrix.shard == 'coop'
        run: |
          set -euo pipefail
          cd "$GAME"
          ./Driftwood.exe --net-check
          # Epic keeps its device identity per Windows ACCOUNT, so the check's guest runs as a second,
          # throwaway one (two machines' worth of identity on one runner).
          # ⚠ At most 14 characters: past that, net user stops to ask a Y/N question nobody can answer here.
          password="Dw$(od -An -N4 -tx1 /dev/urandom | tr -d " \n")a9!"
          echo "::add-mask::$password"
          net user dwguest "$password" /add > /dev/null
          icacls "$(cygpath -w "$GAME")" /grant "dwguest:(OI)(CI)RX" /T /Q > /dev/null
          DRIFTWOOD_EOS_GUEST_USER=dwguest DRIFTWOOD_EOS_GUEST_PASSWORD="$password" ./Driftwood.exe --eos-check

      # Per-user install with no prompt, the installed game runs, the uninstaller removes the program
      # and its Apps & Features entry and leaves the player's worlds alone.
      - name: Installer installs, runs and uninstalls
        if: matrix.shard == 'installer'
        run: |
          set -euo pipefail
          [ -n "${SETUP:-}" ] || { echo "the release has no installer"; exit 1; }
          programs="$(cygpath -u "$LOCALAPPDATA")/Programs/Driftwood"
          saves="$(cygpath -u "$APPDATA")/Driftwood"
          mkdir -p "$saves" && echo keep > "$saves/a-world-of-mine.txt"
          "$SETUP" /S
          for f in Driftwood.exe SDL3.dll glfw3.dll soft_oal.dll Driftwood.Net.Eos.dll EOSSDK-Win64-Shipping.dll eos.txt LICENSE.txt "Uninstall Driftwood.exe"; do
            [ -f "$programs/$f" ] || { echo "not installed: $f"; exit 1; }
          done
          cmp "$programs/Driftwood.exe" "$GAME/Driftwood.exe" || { echo "the installer's exe is not the zip's"; exit 1; }
          [ -f "$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/Driftwood.lnk" ] || { echo "no Start menu shortcut"; exit 1; }
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\Driftwood' /v DisplayVersion | grep -q "$VERSION" \
            || { echo "Apps & Features entry missing or wrong version"; exit 1; }
          said=$("$programs/Driftwood.exe" --version); echo "installed: $said"
          [ "$said" = "Driftwood v$VERSION" ] || exit 1
          # _?= runs the uninstaller in place, so this waits for it (it then cannot delete itself).
          "$programs/Uninstall Driftwood.exe" /S "_?=$(cygpath -w "$programs")"
          for f in Driftwood.exe SDL3.dll Driftwood.Net.Eos.dll eos.txt LICENSE.txt; do
            [ ! -e "$programs/$f" ] || { echo "left behind: $f"; exit 1; }
          done
          ! reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\Driftwood' >/dev/null 2>&1 \
            || { echo "Apps & Features entry left behind"; exit 1; }
          [ ! -e "$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/Driftwood.lnk" ] || { echo "Start menu shortcut left behind"; exit 1; }
          [ "$(cat "$saves/a-world-of-mine.txt")" = keep ] || { echo "the uninstaller touched the player's saves"; exit 1; }
          echo "installer PASSED"
